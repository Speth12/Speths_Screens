services:
  speths-screens:
    build: .
    image: speths-screens:latest
    restart: unless-stopped
    ports:
      # SPETHS_PORT sets the port; XHMI_PORT, its old name, still works when SPETHS_PORT is not set.
      - "${SPETHS_PORT:-${XHMI_PORT:-8080}}:8080"
    volumes:
      # Project JSON files — edit in the IDE, read by the runtime.
      - ./project:/project
      # Historian, users, alarms and recipes: persists across restarts. The volume keeps its
      # old name, xhmi-data, on purpose: renaming a volume would start an install empty.
      - xhmi-data:/data
    environment:
      - TZ=${TZ:-America/Chicago}
    healthcheck:
      test: ["CMD", "/speths-screens", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  xhmi-data:
